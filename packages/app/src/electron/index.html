<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>seeya</title>
    <link rel="stylesheet" href="xterm.css" />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <h2>Today</h2>
        <div id="today-panel"></div>
        <h2>Sessions</h2>
        <ul id="session-list"></ul>
        <h2>Status</h2>
        <pre id="status-panel"></pre>
        <div id="schedule-strip">
          <p id="schedule-strip-text"></p>
          <button id="schedule-strip-snooze-15" type="button" hidden></button>
          <button id="schedule-strip-snooze-30" type="button" hidden></button>
          <button id="schedule-strip-snooze-1h" type="button" hidden></button>
          <button id="schedule-strip-skip" type="button" hidden></button>
        </div>
        <button id="end-day-button" type="button"></button>
        <button id="daemon-control-button" type="button"></button>
        <p id="daemon-control-result"></p>
        <button id="autostart-control-button" type="button" hidden></button>
        <p id="autostart-control-result"></p>
        <button id="settings-button" type="button"></button>
      </aside>
      <main id="main">
        <div id="toolbar">
          <button id="new-tab-button" type="button">+</button>
          <div id="tab-strip"></div>
        </div>
        <form id="command-bar" hidden>
          <label>
            Command
            <input
              id="command-bar-command"
              type="text"
              placeholder="claude, codex, or leave blank for a shell"
            />
          </label>
          <label>
            Directory
            <input id="command-bar-cwd" type="text" placeholder="Working directory" />
          </label>
          <button type="submit">Open</button>
          <button id="command-bar-cancel" type="button">Cancel</button>
        </form>
        <div id="terminal-host"></div>
      </main>
    </div>
    <dialog id="fallback-dialog">
      <h3 id="fallback-dialog-title"></h3>
      <p id="fallback-dialog-reason"></p>
      <p id="fallback-dialog-body"></p>
      <div id="fallback-dialog-actions">
        <button id="fallback-dialog-resume-without-plan" type="button" hidden></button>
        <button id="fallback-dialog-open" type="button"></button>
        <button id="fallback-dialog-skip" type="button"></button>
      </div>
    </dialog>
    <dialog id="end-day-dialog">
      <h3 id="end-day-dialog-title"></h3>
      <pre id="end-day-dialog-report"></pre>
      <p id="end-day-dialog-cost"></p>
      <p id="end-day-dialog-progress" hidden></p>
      <div id="end-day-dialog-actions">
        <button id="end-day-dialog-run" type="button" hidden></button>
        <button id="end-day-dialog-cancel" type="button" hidden></button>
      </div>
    </dialog>
    <dialog id="settings-dialog">
      <h3 id="settings-dialog-title"></h3>
      <p id="settings-dialog-daemon-note"></p>
      <div id="settings-rows"></div>
      <h4 id="settings-project-policy-heading"></h4>
      <div id="settings-project-policy-lines"></div>
      <button id="settings-dialog-close" type="button"></button>
    </dialog>
    <dialog id="daemon-ownership-transition-dialog">
      <h3 id="daemon-ownership-transition-title"></h3>
      <p id="daemon-ownership-transition-body"></p>
      <p id="daemon-ownership-transition-status"></p>
      <div id="daemon-ownership-transition-actions">
        <button id="daemon-ownership-transition-accept" type="button"></button>
        <button id="daemon-ownership-transition-decline" type="button"></button>
      </div>
    </dialog>
    <script type="module" src="renderer.js"></script>
  </body>
</html>
