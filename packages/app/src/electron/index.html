<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>seeya</title>
    <link rel="stylesheet" href="xterm.css" />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <button id="sidebar-collapse-toggle" type="button">‹</button>
        <div id="sidebar-content">
          <h2>Projects</h2>
          <button id="new-project-button" type="button"></button>
          <div id="projects-list"></div>
          <p id="project-open-result-text"></p>
          <h2>Other sessions</h2>
          <ul id="other-sessions-list"></ul>
          <form id="session-search-form">
            <label id="session-search-label" for="session-search-input"></label>
            <input id="session-search-input" type="text" />
            <button type="submit" id="session-search-button"></button>
          </form>
          <p id="session-search-message"></p>
          <ul id="session-search-result"></ul>
          <h2>Today</h2>
          <div id="today-panel"></div>
          <h2>Status</h2>
          <pre id="status-panel"></pre>
          <div id="schedule-strip">
            <p id="schedule-strip-text"></p>
            <button id="schedule-strip-snooze-15" type="button" hidden></button>
            <button id="schedule-strip-snooze-30" type="button" hidden></button>
            <button id="schedule-strip-snooze-1h" type="button" hidden></button>
            <button id="schedule-strip-skip" type="button" hidden></button>
          </div>
          <button id="end-day-button" type="button"></button>
          <button id="daemon-control-button" type="button"></button>
          <p id="daemon-control-result"></p>
          <button id="autostart-control-button" type="button" hidden></button>
          <p id="autostart-control-result"></p>
          <button id="settings-button" type="button"></button>
        </div>
      </aside>
      <main id="main">
        <div id="toolbar">
          <button id="sidebar-toggle-button" type="button"></button>
          <button id="new-tab-button" type="button">+</button>
          <div id="tab-strip"></div>
        </div>
        <form id="command-bar" hidden>
          <label>
            Command
            <input
              id="command-bar-command"
              type="text"
              placeholder="claude, codex, or leave blank for a shell"
            />
          </label>
          <label>
            Directory
            <input id="command-bar-cwd" type="text" placeholder="Working directory" />
          </label>
          <button type="submit">Open</button>
          <button id="command-bar-cancel" type="button">Cancel</button>
        </form>
        <div id="terminal-host"></div>
      </main>
    </div>
    <dialog id="fallback-dialog">
      <h3 id="fallback-dialog-title"></h3>
      <p id="fallback-dialog-reason"></p>
      <p id="fallback-dialog-body"></p>
      <div id="fallback-dialog-actions">
        <button id="fallback-dialog-resume-without-plan" type="button" hidden></button>
        <button id="fallback-dialog-open" type="button"></button>
        <button id="fallback-dialog-skip" type="button"></button>
      </div>
    </dialog>
    <dialog id="end-day-dialog">
      <h3 id="end-day-dialog-title"></h3>
      <pre id="end-day-dialog-report"></pre>
      <p id="end-day-dialog-cost"></p>
      <p id="end-day-dialog-progress" hidden></p>
      <div id="end-day-dialog-actions">
        <button id="end-day-dialog-run" type="button" hidden></button>
        <button id="end-day-dialog-cancel" type="button" hidden></button>
      </div>
    </dialog>
    <dialog id="settings-dialog">
      <h3 id="settings-dialog-title"></h3>
      <p id="settings-dialog-daemon-note"></p>
      <div id="settings-rows"></div>
      <h4 id="settings-project-policy-heading"></h4>
      <div id="settings-project-policy-lines"></div>
      <button id="settings-dialog-close" type="button"></button>
    </dialog>
    <dialog id="daemon-ownership-transition-dialog">
      <h3 id="daemon-ownership-transition-title"></h3>
      <p id="daemon-ownership-transition-body"></p>
      <p id="daemon-ownership-transition-status"></p>
      <div id="daemon-ownership-transition-actions">
        <button id="daemon-ownership-transition-accept" type="button"></button>
        <button id="daemon-ownership-transition-decline" type="button"></button>
      </div>
    </dialog>
    <dialog id="new-project-dialog" class="project-dialog">
      <h3 id="new-project-dialog-title"></h3>
      <form id="new-project-form">
        <label>
          Project id
          <input id="new-project-id-input" type="text" placeholder="auth-hardening" />
        </label>
        <p id="new-project-error" class="project-dialog-error"></p>
        <div class="project-dialog-actions">
          <button type="submit" id="new-project-submit"></button>
          <button type="button" id="new-project-cancel"></button>
        </div>
      </form>
    </dialog>
    <dialog id="project-lock-confirm-dialog" class="project-dialog">
      <h3 id="project-lock-confirm-title"></h3>
      <p id="project-lock-confirm-question"></p>
      <div class="project-dialog-actions">
        <button id="project-lock-confirm-proceed" type="button"></button>
        <button id="project-lock-confirm-decline" type="button"></button>
      </div>
    </dialog>
    <dialog id="leftover-changes-confirm-dialog" class="project-dialog">
      <h3 id="leftover-changes-confirm-title"></h3>
      <div id="leftover-changes-confirm-lines"></div>
      <div class="project-dialog-actions">
        <button id="leftover-changes-confirm-commit" type="button"></button>
        <button id="leftover-changes-confirm-proceed" type="button"></button>
      </div>
    </dialog>
    <dialog id="adopt-pick-dialog" class="project-dialog">
      <h3 id="adopt-pick-title"></h3>
      <form id="adopt-pick-form">
        <label>
          <input type="radio" name="adopt-target" id="adopt-target-existing" checked />
          Existing project
        </label>
        <select id="adopt-existing-select"></select>
        <label>
          <input type="radio" name="adopt-target" id="adopt-target-new" />
          New project
        </label>
        <input id="adopt-new-project-id-input" type="text" placeholder="auth-hardening" disabled />
        <p id="adopt-pick-error" class="project-dialog-error"></p>
        <div class="project-dialog-actions">
          <button type="submit" id="adopt-pick-submit"></button>
          <button type="button" id="adopt-pick-cancel"></button>
        </div>
      </form>
    </dialog>
    <dialog id="adopt-launch-confirm-dialog" class="project-dialog">
      <h3 id="adopt-launch-confirm-title"></h3>
      <div id="adopt-launch-confirm-lines"></div>
      <div class="project-dialog-actions">
        <button id="adopt-launch-confirm-proceed" type="button"></button>
        <button id="adopt-launch-confirm-decline" type="button"></button>
      </div>
    </dialog>
    <dialog id="adopt-commit-confirm-dialog" class="project-dialog">
      <h3 id="adopt-commit-confirm-title"></h3>
      <div id="adopt-commit-confirm-lines"></div>
      <div class="project-dialog-actions">
        <button id="adopt-commit-confirm-commit" type="button"></button>
        <button id="adopt-commit-confirm-decline" type="button"></button>
      </div>
    </dialog>
    <dialog id="adopt-result-dialog" class="project-dialog">
      <h3 id="adopt-result-title"></h3>
      <p id="adopt-result-text"></p>
      <div class="project-dialog-actions">
        <button id="adopt-result-open-project" type="button" hidden></button>
        <button id="adopt-result-close" type="button"></button>
      </div>
    </dialog>
    <dialog id="other-sessions-dir-dialog" class="project-dialog">
      <h3 id="other-sessions-dir-dialog-title"></h3>
      <ul id="other-sessions-dir-dialog-sessions"></ul>
      <div class="project-dialog-actions">
        <button id="other-sessions-dir-dialog-close" type="button"></button>
      </div>
    </dialog>
    <script type="module" src="renderer.js"></script>
  </body>
</html>
